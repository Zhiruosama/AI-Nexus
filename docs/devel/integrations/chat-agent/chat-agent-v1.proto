syntax = "proto3";

package ainexus.chat.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The canonical contracts module has not been selected yet. Add go_package
// before generating Go code and keep one versioned source for both services.

// Chat Agent implements all services in this file. The authenticated user is
// obtained from trusted gRPC metadata, not from user_id fields in requests.
service CredentialService {
  rpc ListCredentials(ListCredentialsRequest)
      returns (ListCredentialsResponse);
  rpc CreateCredential(CreateCredentialRequest)
      returns (CreateCredentialResponse);
  rpc UpdateCredential(UpdateCredentialRequest)
      returns (UpdateCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest)
      returns (google.protobuf.Empty);
}

service ConversationService {
  rpc ListConversations(ListConversationsRequest)
      returns (ListConversationsResponse);
  rpc CreateConversation(CreateConversationRequest)
      returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest)
      returns (GetConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest)
      returns (google.protobuf.Empty);
  rpc UpdateConversationTitle(UpdateConversationTitleRequest)
      returns (UpdateConversationTitleResponse);
  rpc ListMessages(ListMessagesRequest)
      returns (ListMessagesResponse);
}

service PresetService {
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  rpc CreatePreset(CreatePresetRequest) returns (CreatePresetResponse);
  rpc UpdatePreset(UpdatePresetRequest) returns (UpdatePresetResponse);
  rpc DeletePreset(DeletePresetRequest) returns (google.protobuf.Empty);
}

service AgentService {
  // Creates one durable Agent Run and streams ordered events.
  rpc StreamMessage(StreamMessageRequest) returns (stream ChatEvent);

  // Used to reconcile an interrupted stream.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);

  // Idempotently requests cancellation of a non-terminal Run.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_OPENAI = 1;
  PROVIDER_TYPE_ANTHROPIC = 2;
  PROVIDER_TYPE_GEMINI = 3;
  PROVIDER_TYPE_OPENAI_COMPATIBLE = 4;
}

message ProviderCredential {
  uint64 credential_id = 1;
  ProviderType provider = 2;
  string name = 3;
  bool is_active = 4;
  string base_url = 5;

  // A masked value such as sk-****abcd. The secret is never returned.
  string secret_mask = 6;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_used_at = 9;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated ProviderCredential credentials = 1;
}

message CreateCredentialRequest {
  // Makes a repeated create command idempotent.
  string operation_id = 1;
  ProviderType provider = 2;
  string name = 3;

  // Sensitive: never log or return this value.
  string secret = 4;

  // Required only for OPENAI_COMPATIBLE.
  string base_url = 5;
}

message CreateCredentialResponse {
  ProviderCredential credential = 1;
}

message UpdateCredentialRequest {
  uint64 credential_id = 1;
  optional ProviderType provider = 2;
  optional string name = 3;

  // Sensitive: never log or return this value.
  optional string secret = 4;

  // Presence with an empty value clears the URL when the provider allows it.
  optional string base_url = 5;
  optional bool is_active = 6;
}

message UpdateCredentialResponse {
  ProviderCredential credential = 1;
}

message DeleteCredentialRequest {
  uint64 credential_id = 1;
}

message Conversation {
  string conversation_id = 1;
  uint64 credential_id = 2;
  string title = 3;
  string model = 4;
  string system_prompt = 5;
  string active_run_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListConversationsRequest {
  uint32 page_index = 1;
  uint32 page_size = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  uint64 total = 2;
}

message CreateConversationRequest {
  string operation_id = 1;
  uint64 credential_id = 2;
  string title = 3;
  string model = 4;
  string system_prompt = 5;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  string conversation_id = 1;
}

message UpdateConversationTitleRequest {
  string conversation_id = 1;
  string title = 2;
}

message UpdateConversationTitleResponse {
  Conversation conversation = 1;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
}

message ConversationMessage {
  uint64 message_id = 1;
  string conversation_id = 2;
  string run_id = 3;
  MessageRole role = 4;
  string content = 5;
  bool is_partial = 6;
  uint32 prompt_tokens = 7;
  uint32 completion_tokens = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListMessagesRequest {
  string conversation_id = 1;

  // Return messages with IDs less than this value. Zero means the newest page.
  uint64 before_message_id = 2;
  uint32 page_size = 3;
}

message ListMessagesResponse {
  // Returned in chronological order within the page.
  repeated ConversationMessage messages = 1;
  uint64 next_before_message_id = 2;
  bool has_more = 3;
}

message Preset {
  uint64 preset_id = 1;
  string name = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListPresetsRequest {}

message ListPresetsResponse {
  repeated Preset presets = 1;
}

message CreatePresetRequest {
  string operation_id = 1;
  string name = 2;
  string content = 3;
}

message CreatePresetResponse {
  Preset preset = 1;
}

message UpdatePresetRequest {
  uint64 preset_id = 1;
  optional string name = 2;
  optional string content = 3;
}

message UpdatePresetResponse {
  Preset preset = 1;
}

message DeletePresetRequest {
  uint64 preset_id = 1;
}

message GenerationOptions {
  // Presence is significant: temperature=0 is different from not specified.
  optional double temperature = 1;
  optional double top_p = 2;
  optional uint32 max_output_tokens = 3;
}

message StreamMessageRequest {
  // Business idempotency key, unique for one authenticated user.
  string request_id = 1;
  string conversation_id = 2;
  string content = 3;
  GenerationOptions options = 4;
}

message ChatEvent {
  string run_id = 1;

  // Monotonically increasing within one Run.
  uint64 sequence = 2;

  google.protobuf.Timestamp occurred_at = 3;

  oneof event {
    RunAccepted accepted = 10;
    ContentDelta content_delta = 11;
    UsageUpdated usage_updated = 12;
    RunCompleted completed = 13;
    RunFailed failed = 14;
    RunCancelled cancelled = 15;
    Heartbeat heartbeat = 16;
  }
}

message RunAccepted {
  uint64 user_message_id = 1;
}

message ContentDelta {
  string delta = 1;
}

message Usage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

message UsageUpdated {
  Usage usage = 1;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_CONTENT_FILTER = 3;
  FINISH_REASON_TOOL_CALL = 4;
}

message RunCompleted {
  uint64 assistant_message_id = 1;
  FinishReason finish_reason = 2;
  Usage usage = 3;
}

message RunFailed {
  // Stable, machine-readable domain error code.
  string code = 1;

  // Sanitized text without secrets or raw provider responses.
  string message = 2;

  bool retryable = 3;
  bool partial_output_persisted = 4;
  uint64 assistant_message_id = 5;
}

enum CancellationReason {
  CANCELLATION_REASON_UNSPECIFIED = 0;
  CANCELLATION_REASON_CLIENT_DISCONNECTED = 1;
  CANCELLATION_REASON_USER_REQUESTED = 2;
  CANCELLATION_REASON_DEADLINE_EXCEEDED = 3;
  CANCELLATION_REASON_SERVICE_SHUTDOWN = 4;
}

message RunCancelled {
  CancellationReason reason = 1;
  bool partial_output_persisted = 2;
  uint64 assistant_message_id = 3;
}

message Heartbeat {}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_STREAMING = 2;
  RUN_STATUS_COMPLETED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELLED = 5;
}

message AgentRun {
  string run_id = 1;
  string request_id = 2;
  string conversation_id = 3;
  uint64 user_message_id = 4;
  uint64 assistant_message_id = 5;
  RunStatus status = 6;
  ProviderType provider = 7;
  string model = 8;
  FinishReason finish_reason = 9;
  Usage usage = 10;
  string error_code = 11;
  string error_message = 12;
  bool partial_output_persisted = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp first_token_at = 16;
  google.protobuf.Timestamp completed_at = 17;
}

message GetRunRequest {
  oneof lookup {
    string run_id = 1;

    // Allows reconciliation when the connection was lost before RunAccepted.
    string request_id = 2;
  }
}

message GetRunResponse {
  AgentRun run = 1;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  AgentRun run = 1;
}
