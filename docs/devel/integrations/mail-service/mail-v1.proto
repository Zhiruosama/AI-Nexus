syntax = "proto3";

package ainexus.mail.v1;

import "google/protobuf/timestamp.proto";

// Mail Service implements this service.
service MailDispatchService {
  // Reliably and idempotently accepts an email task.
  rpc SubmitEmail(SubmitEmailRequest) returns (SubmitEmailResponse);

  // Supports timeout resolution and callback reconciliation.
  rpc GetEmailStatus(GetEmailStatusRequest) returns (GetEmailStatusResponse);
}

// AI-Nexus implements this service.
service MailDeliveryCallbackService {
  // Reports an at-least-once delivery status event.
  rpc ReportDelivery(ReportDeliveryRequest)
      returns (ReportDeliveryResponse);
}

message SubmitEmailRequest {
  // Generated by AI-Nexus and used as the submission idempotency key.
  string request_id = 1;

  Recipient recipient = 2;

  // For example: verification_code.v1.
  string template_key = 3;

  // BCP 47 language tag, for example: zh-CN.
  string locale = 4;

  oneof payload {
    VerificationCodePayload verification_code = 10;
  }

  google.protobuf.Timestamp requested_at = 20;

  // The task must not be sent after this point.
  google.protobuf.Timestamp dispatch_deadline = 21;
}

message Recipient {
  string email = 1;
  string display_name = 2;
}

message VerificationCodePayload {
  // Sensitive: never include this value in logs or error details.
  string code = 1;

  VerificationPurpose purpose = 2;

  // Used by the template and by AI-Nexus after activation.
  uint32 valid_for_seconds = 3;
}

enum VerificationPurpose {
  VERIFICATION_PURPOSE_UNSPECIFIED = 0;
  VERIFICATION_PURPOSE_REGISTER = 1;
  VERIFICATION_PURPOSE_RESET_PASSWORD = 2;
  VERIFICATION_PURPOSE_LOGIN = 3;
}

message SubmitEmailResponse {
  string request_id = 1;

  // Generated by Mail Service and stable for duplicate submissions.
  string message_id = 2;

  SubmitDisposition disposition = 3;
}

enum SubmitDisposition {
  SUBMIT_DISPOSITION_UNSPECIFIED = 0;
  SUBMIT_DISPOSITION_ACCEPTED = 1;
  SUBMIT_DISPOSITION_DUPLICATE = 2;
}

message GetEmailStatusRequest {
  string request_id = 1;
}

message GetEmailStatusResponse {
  string request_id = 1;
  string message_id = 2;
  DeliveryStatus status = 3;
  google.protobuf.Timestamp occurred_at = 4;
  uint64 sequence = 5;
  FailureInfo failure = 6;
}

message ReportDeliveryRequest {
  // The callback idempotency key.
  string event_id = 1;

  string request_id = 2;
  string message_id = 3;
  DeliveryStatus status = 4;
  google.protobuf.Timestamp occurred_at = 5;
  uint32 attempt = 6;

  // Monotonically increasing within one message_id.
  uint64 sequence = 7;

  FailureInfo failure = 8;
}

message ReportDeliveryResponse {
  string event_id = 1;

  // Duplicate events are considered accepted.
  bool accepted = 2;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_QUEUED = 1;
  DELIVERY_STATUS_SENDING = 2;
  DELIVERY_STATUS_RETRYING = 3;

  // The SMTP server or provider accepted the message.
  DELIVERY_STATUS_PROVIDER_ACCEPTED = 4;

  DELIVERY_STATUS_PERMANENTLY_FAILED = 5;
  DELIVERY_STATUS_DEAD_LETTERED = 6;

  // Reserved for provider webhooks in a later phase.
  DELIVERY_STATUS_DELIVERED = 7;
  DELIVERY_STATUS_BOUNCED = 8;
}

message FailureInfo {
  FailureCategory category = 1;

  // Stable, machine-readable code.
  string code = 2;

  // Sanitized text without codes, credentials, or full provider responses.
  string message = 3;

  bool retryable = 4;
}

enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_VALIDATION = 1;
  FAILURE_CATEGORY_RATE_LIMITED = 2;
  FAILURE_CATEGORY_PROVIDER_AUTH = 3;
  FAILURE_CATEGORY_PROVIDER_REJECTED = 4;
  FAILURE_CATEGORY_PROVIDER_UNAVAILABLE = 5;
  FAILURE_CATEGORY_NETWORK = 6;
  FAILURE_CATEGORY_INTERNAL = 7;
}
