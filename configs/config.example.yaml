server:
  host: "${SERVER_HOST}"
  public: "${SERVER_PUBLIC}"
  port: ${SERVER_PORT}

mysql:
  host: "${MYSQL_HOST}"
  port: ${MYSQL_PORT}
  user: "${MYSQL_USER}"
  pass: "${MYSQL_PASSWORD}"
  database: "${MYSQL_DATABASE}"

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: ${REDIS_DB}

ratelimit:
  limitmax: 100
  window: 1m

idempotency:
  lockduration: 30s

deduplication:
  lockduration: 5s

mail:
  address: "${MAIL_GRPC_ADDRESS}"
  timeout: ${MAIL_GRPC_TIMEOUT}
  allowinsecure: ${MAIL_GRPC_ALLOW_INSECURE}
  tlscafile: "${MAIL_GRPC_TLS_CA_FILE}"
  tlsservername: "${MAIL_GRPC_TLS_SERVER_NAME}"
  callbackaddress: "${MAIL_CALLBACK_ADDRESS}"
  callbackallowinsecure: ${MAIL_CALLBACK_ALLOW_INSECURE}
  callbacktlscertfile: "${MAIL_CALLBACK_TLS_CERT_FILE}"
  callbacktlskeyfile: "${MAIL_CALLBACK_TLS_KEY_FILE}"
  senderidentitykey: "${MAIL_SENDER_IDENTITY_KEY}"
  locale: "${MAIL_LOCALE}"
  verificationttl: ${MAIL_VERIFICATION_TTL}
  dispatchdeadline: ${MAIL_DISPATCH_DEADLINE}
  pendingttl: ${MAIL_PENDING_TTL}
  cooldown: ${MAIL_VERIFICATION_COOLDOWN}
  maxattempts: ${MAIL_VERIFICATION_MAX_ATTEMPTS}
  reconcileinterval: ${MAIL_RECONCILE_INTERVAL}
  hmacsecret: "${VERIFICATION_HMAC_SECRET}"
  emailfingerprintsecret: "${VERIFICATION_EMAIL_FINGERPRINT_SECRET}"

rabbitmq:
  host: "${RABBITMQ_HOST}"
  port: ${RABBITMQ_PORT}
  user: "${RABBITMQ_USER}"
  password: "${RABBITMQ_PASSWORD}"
  vhost: "${RABBITMQ_VHOST}"

chat:
  encryptionkey: "${CHAT_ENCRYPTION_KEY}"
  maxmessagesperconv: 100
